services:
  app:
    build: .
    container_name: movie-rec-app
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4000
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: 12345678
      NEO4J_DATABASE: neo4j
